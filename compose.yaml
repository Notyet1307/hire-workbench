services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set APP_ACCESS_TOKEN to a random secret of at least 16 characters}
      SEED_DEMO: ${SEED_DEMO:-false}
      AI_MODE: ${AI_MODE:-rules}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-json_object}
    volumes:
      - workbench-data:/app/data
    restart: unless-stopped
volumes:
  workbench-data:
